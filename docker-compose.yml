services:
  app:
    image: bloglist-front
    build:
      context: ./client
      dockerfile: Dockerfile

  nginx:
    image: nginx:1.29
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - 8080:80
    depends_on:
      - app
      - server

  server:
    image: bloglist-backend
    build:
      context: ./server
      dockerfile: Dockerfile
    env_file:
      - ./server/.env