name: Deployment pipeline

on:
  push:
    branches:
      - main
      - cicd-pipeline

jobs:
  build_and_test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm ci 
      - name: Check style
        run: npm run lint
        