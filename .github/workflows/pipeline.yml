name: Deployment pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches: [main]
    types: [opened, synchronize]

jobs:
  build_and_test:
    runs-on: ubuntu-latest
    env:
      SECRET: ${{ secrets.JWT_SECRET }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix server
          npm ci --prefix client
          npm ci --prefix playwright
      - name: Check style
        run: npm run lint
      - name: Run client and server tests
        run: npm test 
      - name: Run npm run build
        run: npm run build
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps
        working-directory: playwright
      - name: Run Playwright tests
        run: npm run test:e2e
      - uses: actions/upload-artifact@v5
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 12

  deploy:
    needs: [build_and_test]
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'push' &&
      !contains(join(github.event.commits.*.message, ' '), '#skip')
    steps:
      - name: Trigger deployment
        run: curl ${{ secrets.RENDER_DEPLOY_HOOK }}

  tag_release:
    needs: [deploy]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: >-
      github.event_name == 'push' &&
      !contains(join(github.event.commits.*.message, ' '), '#skip')
    steps:
      - uses: actions/checkout@v6
      - name: Bump version and push tag
        uses: anothrNick/github-tag-action@4ed44965e0db8dab2b466a16da04aec3cc312fd8
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  notify_success:
    runs-on: ubuntu-latest
    if: >-
      success() &&
      !contains(join(github.event.commits.*.message, ' '), '#skip')
    steps:
      - name: Notify deployment success
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.FS_DISCORD_WEBHOOK }}
          nodetail: true
          content: ":white_check_mark: **Deployment Successful!** A new version deployed to production"
          title: "Deployment Details"
          url: "https://github.com/tyj916/fs-pokedex"
          description: |
            **Commit:** `${{ github.sha }}`
            **Message:** ${{ github.event.head_commit.message }}
            **Author:** ${{ github.event.head_commit.author.username }}
