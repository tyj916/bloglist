name: Deployment pipeline

on:
  push:
    branches:
      - main
      - cicd-pipeline

jobs:
  build_and_test:
    runs-on: ubuntu-latest
    env:
      SECRET: ${{ secrets.JWT_SECRET }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix server
          npm ci --prefix client
          npm ci --prefix playwright
      - name: Check style
        run: npm run lint
      - name: Run client and server tests
        run: npm test 
      - name: Run npm run build
        run: npm run build
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps
        working-directory: playwright
      - name: Check MongoDB binary
        run: |
          cd server
          node -e "const { MongoMemoryServer } = require('mongodb-memory-server'); MongoMemoryServer.create().then(async db => { console.log('MongoDB started:', db.getUri()); await db.stop(); }).catch(err => { console.error(err); process.exit(1); })"

      - name: Run Playwright tests
        env:
          SECRET: ${{ secrets.JWT_SECRET }}
          CI: true
          DEBUG: pw:webserver
        run: npm run test:e2e
      - uses: actions/upload-artifact@v5
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 12
